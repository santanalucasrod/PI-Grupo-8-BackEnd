# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI/CD com Maven e Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-maven:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cafeteria
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Popular Banco de Dados
      run: |
        sudo apt-get update && sudo apt-get install -y mysql-client
        mysql -h 127.0.0.1 -u root -p"${{ secrets.TEST_DB_ROOT_PASSWORD }}" cafeteria < ./script_cafeteria_v5.sql

    - name: Build and Test with Maven
      run: mvn clean install
      working-directory: ./KentoCafe
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/cafeteria?useSSL=false&serverTimezone=UTC
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}

  build-docker:
    runs-on: ubuntu-latest
    needs: build-maven
    if: github.event_name == 'push' # Cria img em push só
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir e enviar a imagem
      uses: docker/build-push-action@v5
      with:
        context: ./KentoCafe
        file: ./KentoCafe/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-kento-cafe:latest


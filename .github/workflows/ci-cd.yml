# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI/CD com Maven e Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-maven:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Os testes do projeto são unitários (JUnit + Mockito) e usam H2 em memória
    # (veja src/test/resources/application-test.properties). Não é necessário
    # subir um MySQL real nem popular banco de dados para rodá-los no CI.
    - name: Build and Test with Maven
      run: mvn clean install -e -Dsurefire.useFile=false
      working-directory: ./KentoCafe

  build-docker:
    runs-on: ubuntu-latest
    needs: build-maven
    if: github.event_name == 'push' # Cria img em push só
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir e enviar a imagem
      uses: docker/build-push-action@v5
      with:
        context: ./KentoCafe
        file: ./KentoCafe/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-kento-cafe:latest

